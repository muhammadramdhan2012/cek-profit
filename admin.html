<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — Cek Untung</title>
<link rel="icon" href="icon-cek-untung.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="assets/theme.js?v=f5317dffb6"></script>
<link rel="stylesheet" href="assets/base.css?v=b11f335bb1">
<link rel="stylesheet" href="assets/account.css?v=cf43446c3f">
<script src="assets/config.js?v=06b26d90cd"></script>
</head>
<body class="admin">
<div class="wrap">
  <header class="admin-top">
    <a class="brand" href="./"><svg class="logo" width="28" height="28" viewBox="0 0 16 16" aria-hidden="true"><rect class="lg-bg" width="16" height="16" rx="4.5" fill="var(--accent)"/><rect class="lg-b" x="3" y="9" width="2" height="4" rx="1" fill="var(--accent-ink)" opacity=".62"/><rect class="lg-b" x="7" y="7" width="2" height="6" rx="1" fill="var(--accent-ink)" opacity=".85"/><rect class="lg-b" x="11" y="5" width="2" height="8" rx="1" fill="var(--accent-ink)"/><circle class="lg-d" cx="12.6" cy="2.9" r="1.5" fill="var(--mark)"/></svg>Admin</a>
    <div class="row-gap"><span data-theme-toggle></span><button class="btn sm" type="button" id="reload">Muat ulang</button><a class="btn sm quiet" href="dashboard.html">Dashboard</a></div>
  </header>
  <main class="admin-grid" id="main" aria-live="polite"><p class="muted">Memuat…</p></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="assets/akses.js?v=974818e438"></script>
<script src="assets/cloud.js?v=98df9d05e3"></script>
<script>
(() => {
  const C = window.CEK_CONFIG || {};
  const cloud = CekCloud.init({ url: C.supabaseUrl, key: C.supabaseAnonKey });
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const toast = (m) => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3200); };
  const today = () => new Date().toLocaleDateString('sv-SE');
  // Status Pro dari assets/akses.js (tanggal perangkat, sama dengan cloud.isPro sebelumnya).
  const proAktif = (p) => CekAkses.proAkun(p, CekAkses.tanggalPerangkat());
  const plus = (months, from) => { const d = from && from > today() ? new Date(`${from}T00:00:00`) : new Date(); d.setMonth(d.getMonth() + months); return d.toLocaleDateString('sv-SE'); };
  const tgl = (d) => (d ? new Date(d.length > 10 ? d : `${d}T00:00:00`).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '—');
  const PLAN = { pro_bulanan: 'Pro bulanan', pro_tahunan: 'Pro tahunan', jasa: 'Jasa laporan' };
  const rp = (n) => `Rp${Number(n || 0).toLocaleString('id-ID')}`;
  const HARGA = { normal: 149000, awal: 99000 };   // harga Pro per tahun & harga pengguna awal (keputusan pemilik 1 Nov 2026)
  // situs = status_situs() dari server; null bila SQL tahap 2 belum dijalankan. beli = id pengguna yang formnya terbuka.
  let profiles = [], requests = [], purchases = [], situs = null, beli = null, q = '';
  // masukan = null bila tabel feedback belum dibuat (SQL belum dijalankan ulang). fbFilter: 'aktif' (baru+dibaca) / 'semua'.
  let masukan = null, fbFilter = 'aktif';
  // Pembayaran online (Duitku): pesanan = null bila SQL pembayaran belum dijalankan; modeBayar dari server.
  let pesanan = null, modeBayar = null;
  const ST_PESANAN = { menunggu: 'todo', lunas: 'ok', gagal: 'bad', kedaluwarsa: '' };
  const JENIS = { saran: 'Saran fitur', masalah: 'Ada yang salah', lainnya: 'Lainnya' };
  const sudahHargaAwal = (id) => purchases.some((b) => b.user_id === id && b.harga_pengguna_awal);

  async function load() {
    const main = $('#main');
    if (!cloud.enabled) { main.innerHTML = '<p class="panel">Akun belum diaktifkan. Isi <code>supabaseUrl</code> dan <code>supabaseAnonKey</code> di <code>assets/config.js</code>.</p>'; return; }
    if (!cloud.auth.user()) { main.innerHTML = '<div class="panel" style="display:grid;gap:12px;justify-items:start"><h2>Masuk sebagai admin</h2><p class="muted">Halaman ini hanya untuk pemilik situs.</p><a class="btn primary" href="akun.html?next=admin.html">Masuk</a></div>'; return; }
    try {
      const me = await cloud.db.profile();
      if (!me || !me.is_admin) { main.innerHTML = '<div class="panel"><h2>Bukan admin</h2><p class="muted" style="margin-top:8px">Akun ini belum ditandai admin. Di Supabase: Table Editor → profiles → baris akun Anda → ubah <code>is_admin</code> menjadi <code>true</code>.</p></div>'; return; }
      [profiles, requests] = await Promise.all([cloud.db.adminProfiles(), cloud.db.adminRequests()]);
      // Tahap 2: gagal = SQL tahap 2 belum dijalankan; halaman tetap bisa dipakai dengan fitur lama.
      [situs, purchases, masukan] = await Promise.all([cloud.db.statusSitus().catch(() => null), cloud.db.adminPurchases().catch(() => []), cloud.db.adminFeedback().catch(() => null)]);
      [pesanan, modeBayar] = await Promise.all([cloud.db.adminPesanan().catch(() => null), cloud.db.statusPembayaran().then((x) => x && x.mode).catch(() => null)]);
      render();
    } catch (e) { main.innerHTML = `<p class="panel bad">${esc(e.message)}</p>`; }
  }
  function render() {
    const byId = new Map(profiles.map((p) => [p.id, p]));
    const week = new Date(Date.now() - 7 * 864e5).toISOString();
    const open = requests.filter((r) => r.status === 'baru' || r.status === 'diproses');
    const pros = profiles.filter((p) => proAktif(p));
    const list = profiles.filter((p) => !q || `${p.email} ${p.full_name} ${p.store_name} ${p.whatsapp}`.toLowerCase().includes(q));
    $('#main').innerHTML = `
      <section class="stats">
        <div class="stat"><span class="small muted">Pengguna</span><b>${profiles.length}</b></div>
        <div class="stat"><span class="small muted">Pro aktif</span><b>${pros.length}</b></div>
        <div class="stat"><span class="small muted">Permintaan menunggu</span><b>${open.length}</b></div>
        <div class="stat"><span class="small muted">Daftar 7 hari terakhir</span><b>${profiles.filter((p) => p.created_at > week).length}</b></div>
        <div class="stat"><span class="small muted">Masukan baru</span><b>${masukan ? masukan.filter((f) => f.status === 'baru').length : '—'}</b></div>
      </section>
      ${panelMasukan(byId)}
      ${panelPembayaran(byId)}
      ${situs ? `<section class="panel"><h3 style="margin-bottom:6px">Masa beta &amp; pembelian</h3>
        <p class="small muted" style="margin-bottom:12px">Tanggal server hari ini: <b>${tgl(situs.hari_ini)}</b>. Masa beta ${situs.beta_aktif ? '<span class="badge ok">aktif</span>' : '<span class="badge">tidak aktif</span>'}${situs.pembelian_dibuka_pada ? ` · batas klaim harga pengguna awal ${tgl(situs.klaim_harga_awal_sampai)}` : ''}</p>
        <div class="row-gap" style="align-items:end;flex-wrap:wrap">
          <label class="small">Beta gratis sampai (kosong = tanpa beta)<br><input class="plain" type="date" id="situs-beta" value="${esc(situs.beta_gratis_sampai || '')}"></label>
          <label class="small">Pembelian Pro dibuka pada (kosong = belum)<br><input class="plain" type="date" id="situs-buka" value="${esc(situs.pembelian_dibuka_pada || '')}"></label>
          <button class="btn sm primary" type="button" id="situs-simpan">Simpan</button></div>
        <p class="tiny faint" style="margin-top:8px">Akun yang dibuat sampai akhir masa beta tercatat sebagai pengguna awal. Mengubah tanggal tidak mencabut status pengguna awal yang sudah ada. Teks pengumuman di halaman depan ikut tanggal ini.</p></section>`
        : '<section class="panel"><p class="small muted">Fitur tahap 2 (masa beta, pengguna awal, catatan pembelian) belum aktif: jalankan ulang <code>supabase/schema.sql</code> di SQL Editor. Lihat <code>supabase/PANDUAN.md</code>.</p></section>'}
      <section class="panel"><h3 style="margin-bottom:12px">Permintaan upgrade</h3>
        ${requests.length ? `<div class="tablewrap"><table class="tbl"><thead><tr><th>Tanggal</th><th>Pengguna</th><th>Paket</th><th>Catatan</th><th>Status</th><th></th></tr></thead><tbody>
          ${requests.map((r) => { const p = byId.get(r.user_id) || {}; return `<tr><td>${tgl(r.created_at)}</td><td><b>${esc(p.email || r.user_id)}</b><br><span class="tiny faint">${esc(p.store_name || '')} ${esc(p.whatsapp || '')}</span></td>
            <td>${PLAN[r.plan] || esc(r.plan)}</td><td class="small">${esc(r.note)}</td><td><span class="badge ${r.status === 'selesai' ? 'ok' : r.status === 'ditolak' ? 'bad' : 'todo'}">${esc(r.status)}</span></td>
            <td>${r.status === 'baru' || r.status === 'diproses' ? `<div class="row-gap">${situs ? `<button class="btn sm primary" data-beli="${esc(r.user_id)}">Catat pembelian</button>` : `<button class="btn sm primary" data-pro="${esc(r.user_id)}" data-months="${r.plan === 'pro_tahunan' ? 12 : 1}">Aktifkan ${r.plan === 'pro_tahunan' ? '1 tahun' : '1 bulan'}</button>`}<button class="btn sm quiet" data-reject="${r.id}">Tolak</button></div>` : ''}</td></tr>`; }).join('')}
          </tbody></table></div>` : '<p class="muted small">Belum ada permintaan.</p>'}
      </section>
      <section class="panel"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px"><h3>Pengguna</h3><input class="plain" id="q" type="search" placeholder="Cari email, nama, toko…" value="${esc(q)}" style="max-width:280px"></div>
        <div class="tablewrap"><table class="tbl"><thead><tr><th>Pengguna</th><th>Daftar</th><th>Pro sampai</th><th>Atur Pro</th></tr></thead><tbody>
        ${list.map((p) => `<tr><td><b>${esc(p.email)}</b>${p.is_admin ? ' <span class="badge">admin</span>' : ''}${p.penguji_pembayaran ? ' <span class="badge todo">penguji pembayaran</span>' : ''}${p.pengguna_awal ? ` <span class="badge ${sudahHargaAwal(p.id) ? '' : 'ok'}">pengguna awal${sudahHargaAwal(p.id) ? ' · harga khusus terpakai' : ''}</span>` : ''}<br><span class="tiny faint">${esc(p.full_name)} ${p.store_name ? `· ${esc(p.store_name)}` : ''} ${esc(p.whatsapp)}</span></td>
          <td class="small">${tgl(p.created_at)}</td><td>${proAktif(p) ? `<span class="badge pro">${tgl(p.pro_until)}</span>` : p.pro_until ? `<span class="small faint">berakhir ${tgl(p.pro_until)}</span>` : '<span class="faint">—</span>'}</td>
          <td><div class="row-gap">${situs ? `<button class="btn sm primary" data-beli="${esc(p.id)}">Catat pembelian</button>` : ''}<button class="btn sm" data-pro="${esc(p.id)}" data-months="1">+1 bln</button><button class="btn sm" data-pro="${esc(p.id)}" data-months="12">+1 thn</button>${p.pro_until ? `<button class="btn sm quiet danger" data-off="${esc(p.id)}">Matikan</button>` : ''}${pesanan ? `<button class="btn sm quiet" data-penguji="${esc(p.id)}" data-nilai="${p.penguji_pembayaran ? '0' : '1'}">${p.penguji_pembayaran ? 'Hapus penguji' : 'Jadikan penguji'}</button>` : ''}</div></td></tr>${beli === p.id ? formBeli(p) : ''}`).join('') || '<tr><td colspan="4" class="muted">Tidak ada pengguna yang cocok.</td></tr>'}
        </tbody></table></div><p class="tiny faint" style="margin-top:8px">"Catat pembelian" = Pro 1 tahun + tersimpan di catatan pembelian. Tombol +1 bln / +1 thn / Matikan hanya untuk koreksi manual (tidak tercatat sebagai pembelian).</p></section>
      ${purchases.length ? `<section class="panel"><h3 style="margin-bottom:12px">Catatan pembelian Pro</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>Dicatat</th><th>Pengguna</th><th>Harga</th><th>Berlaku</th><th>Catatan</th></tr></thead><tbody>
        ${purchases.map((b) => `<tr><td class="small">${tgl(b.created_at)}</td><td>${esc((byId.get(b.user_id) || {}).email || b.user_id)}</td><td>${rp(b.harga)}${b.harga_pengguna_awal ? ' <span class="badge ok">pengguna awal</span>' : ''}</td><td class="small">${tgl(b.mulai)} – ${tgl(b.sampai)}</td><td class="small">${esc(b.catatan)}</td></tr>`).join('')}
        </tbody></table></div></section>` : ''}`;
  }
  /** Masukan pengguna: isi pesan dari pengguna (tidak tepercaya) selalu di-escape. */
  function panelMasukan(byId) {
    if (!masukan) return '<section class="panel"><h3 style="margin-bottom:6px">Masukan pengguna</h3><p class="small muted">Belum aktif: jalankan ulang <code>supabase/schema.sql</code> di SQL Editor (bagian MASUKAN PENGGUNA).</p></section>';
    const list = masukan.filter((f) => fbFilter === 'semua' || f.status !== 'selesai');
    const kontak = (p) => [p.email, p.whatsapp].filter(Boolean).map(esc).join(' · ');
    return `<section class="panel"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px"><h3>Masukan pengguna</h3>
      <div class="row-gap"><button class="btn sm ${fbFilter === 'aktif' ? 'primary' : ''}" type="button" data-fb-filter="aktif">Belum selesai</button><button class="btn sm ${fbFilter === 'semua' ? 'primary' : ''}" type="button" data-fb-filter="semua">Semua (${masukan.length})</button></div></div>
      ${list.length ? `<div class="fb-list">${list.map((f) => { const p = byId.get(f.user_id) || {}; return `<article class="fb-item">
        <div class="fb-meta"><span class="badge ${f.jenis === 'masalah' ? 'bad' : f.jenis === 'saran' ? 'ok' : ''}">${JENIS[f.jenis] || esc(f.jenis)}</span>
          <span class="badge ${f.status === 'baru' ? 'todo' : f.status === 'selesai' ? 'ok' : ''}">${esc(f.status)}</span>
          <span class="tiny faint">${tgl(f.created_at)}${f.halaman ? ` · halaman ${esc(f.halaman)}` : ''}</span></div>
        <p class="fb-pesan">${esc(f.pesan)}</p>
        <div class="fb-meta"><span class="small"><b>${esc(p.full_name || p.email || 'Pengguna')}</b>${p.store_name ? ` · ${esc(p.store_name)}` : ''}</span>
          ${f.boleh_dihubungi ? `<span class="small">Boleh dihubungi: ${kontak(p) || '—'}</span>` : '<span class="tiny faint">Tidak minta dihubungi</span>'}</div>
        <div class="row-gap">${f.status === 'baru' ? `<button class="btn sm" type="button" data-fb="${f.id}" data-st="dibaca">Tandai dibaca</button>` : ''}${f.status !== 'selesai' ? `<button class="btn sm primary" type="button" data-fb="${f.id}" data-st="selesai">Selesai</button>` : `<button class="btn sm quiet" type="button" data-fb="${f.id}" data-st="dibaca">Buka lagi</button>`}</div>
      </article>`; }).join('')}</div>` : `<p class="muted small">${masukan.length ? 'Semua masukan sudah selesai. 🎉' : 'Belum ada masukan.'}</p>`}</section>`;
  }
  /** Pembayaran online Duitku: mode (mati/sandbox) + daftar pesanan. Production dibuka lewat persetujuan terpisah. */
  function panelPembayaran(byId) {
    if (!pesanan) return '<section class="panel"><h3 style="margin-bottom:6px">Pembayaran online (Duitku)</h3><p class="small muted">Belum aktif: jalankan ulang <code>supabase/schema.sql</code> di SQL Editor (bagian PEMBAYARAN ONLINE). Lihat <code>supabase/PANDUAN.md</code>.</p></section>';
    const mode = modeBayar || 'mati';
    return `<section class="panel"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px"><h3>Pembayaran online (Duitku)</h3>
      <div class="row-gap"><span class="small">Mode: <span class="badge ${mode === 'sandbox' ? 'todo' : mode === 'production' ? 'ok' : ''}">${esc(mode)}</span></span>
      ${mode !== 'mati' ? '<button class="btn sm quiet danger" type="button" data-mode-bayar="mati">Tutup pembayaran</button>' : ''}${mode !== 'sandbox' ? '<button class="btn sm" type="button" data-mode-bayar="sandbox">Buka Sandbox (penguji saja)</button>' : ''}</div></div>
      <p class="tiny faint" style="margin-bottom:12px">Sandbox: hanya akun bertanda "penguji pembayaran" yang melihat tombol beli, dengan uang tiruan. Pro aktif otomatis hanya setelah notifikasi Duitku lolos pemeriksaan tanda tangan dan nominal.</p>
      ${pesanan.length ? `<div class="tablewrap"><table class="tbl"><thead><tr><th>Dibuat</th><th>Pengguna</th><th>Harga</th><th>Status</th><th>Pesanan / referensi</th><th>Notifikasi terakhir</th></tr></thead><tbody>
        ${pesanan.map((o) => { const cb = o.callback_terakhir || {}; return `<tr><td class="small">${tgl(o.dibuat)}</td><td>${esc((byId.get(o.user_id) || {}).email || o.email)}</td>
          <td>${rp(o.harga)}${o.harga_pengguna_awal ? ' <span class="badge ok">pengguna awal</span>' : ''}${o.mode === 'sandbox' ? ' <span class="badge">sandbox</span>' : ''}</td>
          <td><span class="badge ${ST_PESANAN[o.status] ?? ''}">${esc(o.status)}</span>${o.dibayar_pada ? `<br><span class="tiny faint">${tgl(o.dibayar_pada)}${o.kode_metode ? ` · ${esc(o.kode_metode)}` : ''}</span>` : ''}</td>
          <td class="small">${esc(o.order_id)}<br><span class="tiny faint">${esc(o.referensi || '—')}</span></td>
          <td class="small">${cb.hasil ? `${esc(cb.hasil)}<br><span class="tiny faint">${tgl(cb.waktu)}</span>` : '<span class="faint">—</span>'}</td></tr>`; }).join('')}
        </tbody></table></div>` : '<p class="muted small">Belum ada pesanan.</p>'}</section>`;
  }
  /** Form catat pembelian (satu baris di bawah pengguna). Server tetap memeriksa semua syarat harga pengguna awal. */
  function formBeli(p) {
    const awal = p.pengguna_awal && !sudahHargaAwal(p.id);
    const bisaAwal = awal && situs && situs.pembelian_dibuka_pada && situs.hari_ini <= situs.klaim_harga_awal_sampai;
    return `<tr><td colspan="4"><div class="row-gap" style="align-items:end;flex-wrap:wrap">
      <label class="small">Harga dibayar (Rp)<br><input class="plain" type="number" min="0" step="1000" id="beli-harga" value="${bisaAwal ? HARGA.awal : HARGA.normal}" style="max-width:140px"></label>
      ${awal ? `<label class="small"><input type="checkbox" id="beli-awal" ${bisaAwal ? 'checked' : 'disabled'}> Harga khusus pengguna awal (tahun pertama)${bisaAwal ? '' : ' · pembelian belum dibuka / lewat 30 hari'}</label>` : ''}
      <label class="small">Catatan (mis. transfer BCA 1 Jan)<br><input class="plain" id="beli-catatan" maxlength="200" style="max-width:240px"></label>
      <button class="btn sm primary" type="button" id="beli-simpan" data-target="${esc(p.id)}">Simpan &amp; aktifkan 1 tahun</button><button class="btn sm quiet" type="button" id="beli-batal">Batal</button></div></td></tr>`;
  }
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('button');
    if (!t) return;
    try {
      if (t.id === 'reload') return load();
      if (t.dataset.beli) { beli = beli === t.dataset.beli ? null : t.dataset.beli; return render(); }
      if (t.id === 'beli-batal') { beli = null; return render(); }
      if (t.id === 'beli-simpan') {
        const p = profiles.find((x) => x.id === t.dataset.target) || {};
        const harga = Math.round(Number($('#beli-harga').value));
        const awal = !!($('#beli-awal') && $('#beli-awal').checked);
        if (!Number.isFinite(harga) || harga < 0) { toast('Isi harga dengan angka rupiah.'); return; }
        if (!confirm(`Catat pembelian ${rp(harga)}${awal ? ' (harga pengguna awal)' : ''} dan aktifkan Pro 1 tahun untuk ${p.email || 'pengguna'}?`)) return;
        const r = await cloud.db.adminCatatPembelian(t.dataset.target, harga, awal, $('#beli-catatan').value.trim());
        beli = null; toast(`Tercatat. Pro aktif ${tgl(r && r.mulai)} – ${tgl(r && r.sampai)}.`); return load();
      }
      if (t.id === 'situs-simpan') {
        const b = $('#situs-beta').value, d = $('#situs-buka').value;
        if (!confirm(`Simpan: beta gratis ${b ? `sampai ${tgl(b)}` : 'TIDAK ADA'}; pembelian ${d ? `dibuka ${tgl(d)}` : 'belum dibuka'}?`)) return;
        await cloud.db.adminSetSitus(b, d); toast('Pengaturan situs tersimpan.'); return load();
      }
      if (t.dataset.pro) {
        const p = profiles.find((x) => x.id === t.dataset.pro) || {};
        const until = plus(+t.dataset.months, p.pro_until);
        if (!confirm(`Aktifkan Pro untuk ${p.email || 'pengguna'} sampai ${tgl(until)}?`)) return;
        await cloud.db.adminSetPro(t.dataset.pro, until); toast(`Pro aktif sampai ${tgl(until)}.`); return load();
      }
      if (t.dataset.off) { if (!confirm('Matikan Pro pengguna ini?')) return; await cloud.db.adminSetPro(t.dataset.off, null); toast('Pro dimatikan.'); return load(); }
      if (t.dataset.modeBayar) {
        const m = t.dataset.modeBayar;
        if (!confirm(m === 'sandbox' ? 'Buka pembayaran Sandbox? Hanya akun penguji yang bisa membeli, dengan uang tiruan.' : 'Tutup pembayaran online? Pesanan yang sudah dibayar tetap diproses.')) return;
        await cloud.db.adminSetPembayaran(m); toast(m === 'sandbox' ? 'Pembayaran Sandbox dibuka untuk penguji.' : 'Pembayaran online ditutup.'); return load();
      }
      if (t.dataset.penguji) {
        const p = profiles.find((x) => x.id === t.dataset.penguji) || {}, on = t.dataset.nilai === '1';
        if (!confirm(`${on ? 'Jadikan' : 'Hapus'} ${p.email || 'pengguna'} ${on ? 'sebagai' : 'dari'} penguji pembayaran?`)) return;
        await cloud.db.adminSetPenguji(t.dataset.penguji, on); toast(on ? 'Akun ditandai penguji.' : 'Tanda penguji dihapus.'); return load();
      }
      if (t.dataset.fbFilter) { fbFilter = t.dataset.fbFilter; return render(); }
      if (t.dataset.fb) { await cloud.db.adminSetFeedbackStatus(+t.dataset.fb, t.dataset.st); const f = masukan.find((x) => x.id === +t.dataset.fb); if (f) f.status = t.dataset.st; toast(t.dataset.st === 'selesai' ? 'Masukan ditandai selesai.' : 'Status masukan diperbarui.'); return render(); }
      if (t.dataset.reject) { await cloud.db.adminSetRequestStatus(+t.dataset.reject, 'ditolak'); toast('Permintaan ditolak.'); return load(); }
    } catch (err) { toast(err.message); }
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'q') { q = e.target.value.toLowerCase(); const pos = e.target.selectionStart; render(); const i = $('#q'); i.focus(); i.setSelectionRange(pos, pos); } });
  load();
})();
</script>
</body>
</html>
