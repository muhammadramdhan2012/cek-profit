name: Periksa
on: [push, pull_request]
jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Nomor versi CSS/JS cocok dengan isi file
        run: python3 scripts/versi.py --check
      - name: Uji mesin hitung, tarif, kode akses, akun
        run: |
          node tests/engine.test.js
          node tests/tampilan.test.js
          node tests/saldo.test.js
          node tests/pajak.test.js
          node tests/surat.test.js
          node tests/tarif.test.js
          node tests/license.test.js
          node tests/cloud.test.js
          node tests/qris.test.js
      - name: Gambar QRIS simulasi tidak boleh masuk main (rilis produksi)
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: |
          if ls img/qris-uji* >/dev/null 2>&1; then echo "img/qris-uji* hanya untuk branch staging. Hapus sebelum merge ke main."; exit 1; fi
      - name: Kebijakan tanpa penanda KEPUTUSAN PEMILIK di main (rilis produksi)
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: |
          if grep -l 'data-keputusan' *.html; then echo "Isi semua 'KEPUTUSAN PEMILIK' di halaman di atas sebelum merge ke main."; exit 1; fi
