name: Periksa
on: [push, pull_request]
jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Nomor versi CSS/JS cocok dengan isi file
        run: python3 scripts/versi.py --check
      - name: Uji mesin hitung, tarif, kode akses, akun
        run: |
          node tests/engine.test.js
          node tests/tampilan.test.js
          node tests/saldo.test.js
          node tests/pajak.test.js
          node tests/tarif.test.js
          node tests/license.test.js
          node tests/cloud.test.js
